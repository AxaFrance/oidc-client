# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: React Oidc CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: 22
jobs:
  skip_ci:
    runs-on: ubuntu-latest
    outputs:
      canSkip: ${{ steps.check.outputs.canSkip }}
    steps:
      - id: check
        uses: Legorooj/skip-ci@main
  tests:
    needs: skip_ci
    runs-on: ubuntu-latest
    if: needs.skip_ci.outputs.canSkip != 'true' && github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: pnpm i
        run: pnpm i --frozen-lockfile
        working-directory: ./packages/react-oidc

      - name: pnpm prepare
        run: pnpm run prepare
        working-directory: ./packages/react-oidc

      - name: pnpm test
        run: pnpm test -- --run
        working-directory: ./packages/react-oidc

      - name: pnpm install
        run: pnpm i --frozen-lockfile
        working-directory: ./packages/oidc-client

      - name: pnpm prepare
        run: pnpm run prepare
        working-directory: ./packages/oidc-client

  build:
    needs: skip_ci
    permissions:
      contents: write
    environment: react-oidc
    runs-on: ubuntu-latest
    if: needs.skip_ci.outputs.canSkip != 'true' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity for versioning and release commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine Alpha, Beta or Release
        id: which_tag
        run: |
          if [[ ${{ github.ref }} == refs/pull* ]]; then
            last_commit_message=$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.number }}/commits" | jq -r '.[-1].commit.message')
          else
            last_commit_message=$(git log --format=%B -n 1)
          fi
          echo "last commit message is: $last_commit_message"
          # Check if last comment and with "(alpha)", "(beta)" or "(release)"
          if [[ $last_commit_message == *alpha* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          fi
          if [[ $last_commit_message == *beta* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          fi
          if [[ $last_commit_message == *release* ]]; then
            echo "tag=release" >> $GITHUB_OUTPUT
          fi

      - name: Compute release version
        id: tag_release
        if: github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release'
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GIT_TOKEN  }}
          dry_run: true
      - name: Compute prerelease version
        id: tag_version
        if: steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GIT_TOKEN  }}
          dry_run: true
      - name: Compute new version number to publish
        id: tag
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        run: |
          set -euo pipefail

          if [[ '${{ steps.which_tag.outputs.tag }}' == 'release' ]]; then
            version="${{ steps.tag_release.outputs.new_version }}"
          else
            version="${{ steps.tag_version.outputs.new_version }}"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Unable to compute the package version to publish."
            exit 1
          fi

          if [[ '${{ steps.which_tag.outputs.tag }}' = 'release' ]]; then
            echo "new_version=$version" >> $GITHUB_OUTPUT
          fi
          if [[ '${{ steps.which_tag.outputs.tag }}' = 'alpha' ]]; then
            echo "new_version=$version-alpha.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi
          if [[ '${{ steps.which_tag.outputs.tag }}' = 'beta' ]]; then
            echo "new_version=$version-beta.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Update package versions to ${{ steps.tag.outputs.new_version }}
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.tag.outputs.new_version }}"
          if [[ -z "$version" ]]; then
            echo "::error::No version has been computed for publication."
            exit 1
          fi

          package_dirs=(
            "packages/oidc-client-service-worker"
            "packages/oidc-client"
            "packages/react-oidc"
          )

          for package_dir in "${package_dirs[@]}"; do
            echo "Updating $package_dir to $version"
            (
              cd "$package_dir"
              npm version "$version" --no-git-tag-version --allow-same-version
            )
          done

          printf "export default '%s';\n" "$version" > packages/oidc-client-service-worker/src/version.ts
          printf "export default '%s';\n" "$version" > packages/oidc-client/src/version.ts


      # oidc-client-service-worker
      - name: pnpm ci
        run: pnpm i --frozen-lockfile
        working-directory: ./packages/oidc-client-service-worker

      - name: pnpm prepare
        run: pnpm run prepare
        working-directory: ./packages/oidc-client-service-worker

      - name: pnpm test
        run: pnpm test -- --run
        working-directory: ./packages/oidc-client-service-worker

      # oidc-client
      - name: pnpm ci
        run: pnpm i --frozen-lockfile
        working-directory: ./packages/oidc-client

      - name: pnpm prepare
        run: pnpm run prepare
        working-directory: ./packages/oidc-client

      - name: pnpm test
        run: pnpm test -- --run
        working-directory: ./packages/oidc-client

      # React-oidc
      - name: pnpm i
        run: pnpm i --frozen-lockfile
        working-directory: ./packages/react-oidc

      - name: pnpm prepare
        run: pnpm run prepare
        working-directory: ./packages/react-oidc

      - name: pnpm test
        run: pnpm test -- --run
        working-directory: ./packages/react-oidc

      - name: Prepare package manifests for npm publish
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const expectedVersion = process.env.EXPECTED_VERSION;
          const packageDependencyUpdates = [
            {
              path: 'packages/oidc-client/package.json',
              dependencies: ['@axa-fr/oidc-client-service-worker'],
            },
            {
              path: 'packages/react-oidc/package.json',
              dependencies: ['@axa-fr/oidc-client', '@axa-fr/oidc-client-service-worker'],
            },
          ];

          for (const { path, dependencies } of packageDependencyUpdates) {
            const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));

            for (const dependencyName of dependencies) {
              if (!packageJson.dependencies?.[dependencyName]) {
                console.error(`${packageJson.name} is missing dependency ${dependencyName}.`);
                process.exit(1);
              }

              packageJson.dependencies[dependencyName] = expectedVersion;
            }

            fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Verify package versions before publish
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const expectedVersion = process.env.EXPECTED_VERSION;
          const packagePaths = [
            'packages/oidc-client-service-worker/package.json',
            'packages/oidc-client/package.json',
            'packages/react-oidc/package.json',
          ];

          let hasError = false;

          for (const packagePath of packagePaths) {
            const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));

            if (packageJson.version !== expectedVersion) {
              console.error(`${packageJson.name} has version ${packageJson.version}, expected ${expectedVersion}.`);
              hasError = true;
            }

            const workspaceDependencies = Object.entries(packageJson.dependencies ?? {})
              .filter(([, version]) => version === 'workspace:*')
              .map(([dependencyName]) => dependencyName);

            if (workspaceDependencies.length > 0) {
              console.error(`${packageJson.name} still contains workspace dependencies: ${workspaceDependencies.join(', ')}.`);
              hasError = true;
            }
          }

          if (hasError) {
            process.exit(1);
          }
          NODE

      - name: Publish packages to npm
        id: npm_publish
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.new_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN is required to publish packages."
            exit 1
          fi

          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > ~/.npmrc
          chmod 0600 ~/.npmrc

          package_dirs=(
            "packages/oidc-client-service-worker"
            "packages/oidc-client"
            "packages/react-oidc"
          )
          package_names=(
            "@axa-fr/oidc-client-service-worker"
            "@axa-fr/oidc-client"
            "@axa-fr/react-oidc"
          )

          publish_tag="${{ steps.which_tag.outputs.tag }}"
          if [[ "$publish_tag" == "release" ]]; then
            publish_tag="latest"
          fi

          published_count=0

          for index in "${!package_dirs[@]}"; do
            package_dir="${package_dirs[$index]}"
            package_name="${package_names[$index]}"

            if npm view "${package_name}@${EXPECTED_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "${package_name}@${EXPECTED_VERSION} already exists on npm; skipping publish."
              continue
            fi

            npm publish "$package_dir" --access public --tag "$publish_tag" --registry=https://registry.npmjs.org/
            published_count=$((published_count + 1))
          done

          if [[ "$published_count" -eq 0 ]]; then
            echo "::error::No expected package was published."
            exit 1
          fi

          echo "published_count=$published_count" >> "$GITHUB_OUTPUT"

      - name: Verify npm packages after publish
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          set -euo pipefail

          package_names=(
            "@axa-fr/oidc-client-service-worker"
            "@axa-fr/oidc-client"
            "@axa-fr/react-oidc"
          )

          for package_name in "${package_names[@]}"; do
            published_version=""

            for attempt in {1..6}; do
              if published_version=$(npm view "${package_name}@${EXPECTED_VERSION}" version --registry=https://registry.npmjs.org/ 2>/dev/null) && [[ "$published_version" == "$EXPECTED_VERSION" ]]; then
                break
              fi

              echo "Waiting for ${package_name}@${EXPECTED_VERSION} to be available on npm (attempt ${attempt}/6)."
              sleep 10
            done

            if [[ "$published_version" != "$EXPECTED_VERSION" ]]; then
              echo "::error::${package_name}@${EXPECTED_VERSION} was not found on npm after publication."
              exit 1
            fi
          done

      - name: Restore workspace dependencies after publish
        if: (github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release') || steps.which_tag.outputs.tag == 'alpha' || steps.which_tag.outputs.tag == 'beta'
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const packageDependencyUpdates = [
            {
              path: 'packages/oidc-client/package.json',
              dependencies: ['@axa-fr/oidc-client-service-worker'],
            },
            {
              path: 'packages/react-oidc/package.json',
              dependencies: ['@axa-fr/oidc-client', '@axa-fr/oidc-client-service-worker'],
            },
          ];

          for (const { path, dependencies } of packageDependencyUpdates) {
            const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));

            for (const dependencyName of dependencies) {
              if (!packageJson.dependencies?.[dependencyName]) {
                console.error(`${packageJson.name} is missing dependency ${dependencyName}.`);
                process.exit(1);
              }

              packageJson.dependencies[dependencyName] = 'workspace:*';
            }

            fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Commit, tag and push release
        if: github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release'
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ steps.tag_release.outputs.new_tag }}"
          if [[ -z "$release_tag" ]]; then
            echo "::error::No release tag has been computed."
            exit 1
          fi

          git add .
          git commit -m "[skip ci] Update to version ${{ steps.tag.outputs.new_version }} in package.json"
          git tag "$release_tag"
          git push --set-upstream origin "HEAD:main" --follow-tags -f

          chmod +x ./bin/generate-changelog.sh
          ./bin/generate-changelog.sh
          git add CHANGELOG.md
          git commit -m "[skip ci] Generate changelog to version ${{ steps.tag.outputs.new_version }}"
          git push --set-upstream origin "HEAD:main" --follow-tags -f

     #  - name: SonarCloud Scan
     #    uses: sonarsource/sonarcloud-github-action@master
     #    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork
     #    env:
     #      GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
     #      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
     #    with:
     #      args: >
     #        -Dsonar.organization=axaguildev
     #        -Dsonar.projectKey=AxaGuilDEv_react-oidc
     #        -Dsonar.exclusions=**/*.spec.js,**/*.stories.js,Scripts/**,**/*.scss,**/__snapshots__/**,**/*[Tt]ests.cs,**/node_modules/**,**/ClientApp/build/**,**/ClientApp/.storybook/**,**/ClientApp/storybook-static/**,**/obj/**,**/__mocks__/**,**/ClientApp/src/serviceWorker.ts
     #        -Dsonar.javascript.lcov.reportPaths=**/coverage/lcov.info
 #
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main' && steps.which_tag.outputs.tag == 'release'
        with:
          tag: ${{ steps.tag_release.outputs.new_tag }}
          name: Release ${{ steps.tag_release.outputs.new_tag }}
          body: ${{ steps.tag_release.outputs.changelog }}
