name: Local OpenIddict demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:server
      - name: Type-check and build the demos
        run: |
          pnpm exec tsc -p examples/react-oidc-demo/tsconfig.json --noEmit
          pnpm exec tsc -p examples/oidc-client-demo/tsconfig.json --noEmit
          pnpm --dir examples/react-oidc-demo build
          pnpm --dir examples/oidc-client-demo build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload credential-masked screenshots
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openiddict-demo-screenshots
          path: examples/e2e/screenshots/*.png
          if-no-files-found: error
